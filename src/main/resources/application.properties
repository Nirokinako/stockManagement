spring.application.name=stockManagement

spring.config.import=optional:file:.env[.properties]

spring.jpa.database=POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRESSQL_DATABASE}
spring.datasource.username=${POSTGRESSQL_USER}
spring.datasource.password=${POSTGRESSQL_PASSWORD}

mybatis.configuration.map-underscore-to-camel-case=true

logging.level.com.example.taskmate.repository=DEBUG
